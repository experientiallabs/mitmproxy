name: CI

on:
  pull_request:
  push:
    branches: [codex/capture-package]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the pinned fork and test dependencies
        run: uv sync --group dev
      - name: Check source formatting
        run: uv run ruff check mitmproxy/proxy/server.py test/mitmproxy/proxy/test_server.py
      - name: Check source layout
        run: uv run ruff format --check mitmproxy/proxy/server.py test/mitmproxy/proxy/test_server.py
      - name: Exercise the proxy engine and stream lifecycle
        run: uv run pytest -q test/mitmproxy/proxy test/mitmproxy/addons/test_proxyserver.py test/mitmproxy/addons/test_next_layer.py
      - name: Build the distribution
        run: uv build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: exp-mitmproxy-${{ runner.os }}
          path: dist/*.whl
