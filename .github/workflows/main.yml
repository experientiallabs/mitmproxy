name: CI

on:
  push:
    branches: [main]
    tags: ['exp-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.17"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.18"
          checksum: 89eadd7c76fc063887959510d5ba0ab1264dfd5f1143b925ddb73021a40acf16
          python-version: "3.13.17"
      - name: Install published release dependencies
        # Match the GitLab release gate; all following commands keep this environment.
        run: uv sync --group dev --no-sources
      - run: uv run --no-sync ruff check mitmproxy/proxy/server.py test/mitmproxy/proxy/test_server.py
      - run: uv run --no-sync ruff format --check mitmproxy/proxy/server.py test/mitmproxy/proxy/test_server.py
      - name: Run the proxy engine release tests
        run: >-
          uv run --no-sync pytest -q test/mitmproxy/net/test_encoding.py
          test/mitmproxy/proxy test/mitmproxy/addons/test_proxyserver.py
          test/mitmproxy/addons/test_next_layer.py
      - name: Build the release distributions
        run: uv build --no-sources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  release-check:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/exp-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a protected release tag from main
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          test "$REF_PROTECTED" = true
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          assert project['name'] == 'exp-mitmproxy'
          assert os.environ['GITHUB_REF_NAME'] == 'exp-v' + project['version']
          PY

  release-smoke:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.17"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.18"
          checksum: 89eadd7c76fc063887959510d5ba0ab1264dfd5f1143b925ddb73021a40acf16
          python-version: "3.13.17"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Install the built wheel with its published native dependency
        run: |
          uv venv "$RUNNER_TEMP/proxy-smoke"
          uv pip install --python "$RUNNER_TEMP/proxy-smoke/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          ./proxy-smoke/bin/python -c 'import mitmproxy, mitmproxy_rs'
          ./proxy-smoke/bin/mitmdump --version

  publish:
    if: github.repository == 'experientiallabs/mitmproxy' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/exp-v')
    needs: [package, release-check, release-smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Publish tested distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
